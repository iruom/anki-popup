name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic collections and timing
        run: ./scripts/test.sh
      - name: Build universal macOS app
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiPopup-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
